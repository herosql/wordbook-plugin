<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-width: 320px; padding: 16px; background: #f5f5f5; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 4px; }
        textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.2s; resize: vertical; }
        textarea:focus { border-color: #4a9eff; }
        .btn-row { display: flex; gap: 8px; }
        button { flex: 1; padding: 8px 12px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: opacity 0.2s, background 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #submitButton { background: #4a9eff; color: white; }
        #submitButton:hover:not(:disabled) { background: #3a8eef; }
        #clearButton { background: #e0e0e0; color: #333; }
        #clearButton:hover:not(:disabled) { background: #d0d0d0; }
        #msg { margin-top: 10px; font-size: 13px; text-align: center; min-height: 18px; }
        .success { color: #52c41a; }
        .error { color: #ff4d4f; }

        /* 模态框 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 8px; padding: 24px; min-width: 260px; text-align: center; }
        .modal-content h3 { font-size: 15px; margin-bottom: 16px; color: #333; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { padding: 6px 16px; font-size: 13px; }
        #confirmYes { background: #4a9eff; color: white; }
        #confirmNo { background: #e0e0e0; color: #333; }

        /* 进度条 */
        #progressWrap { display: none; margin-top: 12px; }
        #progressWrap.show { display: block; }
        #progressBar { width: 100%; height: 16px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
        #progressFill { height: 100%; background: #4a9eff; width: 0%; transition: width 0.1s; }
        #progressText { font-size: 12px; color: #666; margin-top: 4px; text-align: center; }
    </style>
</head>
<body>
    <div class="form-group">
        <label for="lang">语言</label>
        <select id="lang" style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;outline:none;">
            <option value="">请选择</option>
            <option value="en" selected>英文</option>
            <option value="ja">日语</option>
        </select>
    </div>
    <div class="form-group">
        <label for="words">单词列表</label>
        <textarea id="words" rows="4" placeholder="每行一个单词"></textarea>
    </div>
    <div class="btn-row">
        <button id="submitButton">提交</button>
        <button id="clearButton">清空</button>
    </div>
    <div id="msg"></div>
    <div id="progressWrap">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="progressText">0%</div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3 id="confirmText">确认收藏？</h3>
            <div class="modal-btns">
                <button id="confirmYes">确认</button>
                <button id="confirmNo">取消</button>
            </div>
        </div>
    </div>

    <script src="popup.js" charset="UTF-8"></script>
</body>
</html>
